apiVersion: networking.gke.io/v1
kind: GKENetworkParamSet
metadata:
  name: control-plane-params
spec:
  vpc: control-network
  vpcSubnet: control-subnetwork-1
  podIPv4Ranges:
    rangeNames:
      - control-pod-ranges
---
apiVersion: networking.gke.io/v1
kind: Network
metadata:
  name: control-network
spec:
  type: L3
  parametersRef:
    group: networking.gke.io
    kind: GKENetworkParamSet
    name: control-plane-params
---
apiVersion: v1
kind: Namespace
metadata:
  name: admin-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: admin-services
  name: productcatalogadmin
  labels:
    app: productcatalogadmin
spec:
  selector:
    matchLabels:
      app: productcatalogadmin
  template:
    metadata:
      annotations:
            networking.gke.io/default-interface: 'eth0'
            networking.gke.io/interfaces: |
              [
                {"interfaceName":"eth0","network":"default"},
                {"interfaceName":"eth1","network":"control-network"}
              ]
      labels:
        app: productcatalogadmin
    spec:
      serviceAccountName: adminservices
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: us-west1-docker.pkg.dev/gcp-onboarding-project-480819/microservices-demo/adminservice
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        readinessProbe:
          httpGet:
            path: "/_healthz"
            port: 8081
          initialDelaySeconds: 10
        livenessProbe:
          httpGet:
            path: "/_healthz"
            port: 8081
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  namespace: admin-services
  name: productcatalogadmin
  labels:
    app: productcatalogadmin
spec:
  type: ClusterIP
  selector:
    app: productcatalogadmin
  ports:
  - name: http
    port: 80
    targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  namespace: admin-services
  name: productcatalogadmin-control
  labels:
    app: productcatalogadmin
  annotations:
    # This annotation creates an Internal TCP/UDP Load Balancer
    networking.gke.io/load-balancer-type: "Internal"
    # This annotation specifies the subnet for the load balancer's forwarding rule in a multi-network setup.
    networking.gke.io/load-balancer-subnet: "control-subnetwork-1"
    # This annotation specifies which network on the Pods to send traffic to.
    networking.gke.io/network: "control-network"
spec:
  type: LoadBalancer
  selector:
    app: productcatalogadmin
  ports:
  - name: http
    port: 80
    targetPort: 8081
---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: admin-services
  name: adminservices
