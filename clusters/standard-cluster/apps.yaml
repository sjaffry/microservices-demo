apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: microservices-demo-app
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./kustomize
  prune: true
  sourceRef:
    kind: GitRepository
    name: microservices-demo-source 
  targetNamespace: web-store
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: frontend
      namespace: web-store
